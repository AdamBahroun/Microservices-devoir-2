services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s

  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "9999:9999"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_CONFIG_SERVER_MONITOR_GITHUB_WEBHOOKSECRET=${CONFIG_MONITOR_GITHUB_WEBHOOK_SECRET:?Set CONFIG_MONITOR_GITHUB_WEBHOOK_SECRET in .env}
    depends_on:
      rabbitmq:
        condition: service_started
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s

  marques-ms:
    build: ./marque
    container_name: marques-ms
    ports:
      - "8081:8081"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  marques-ms2:
    build: ./marque
    container_name: marques-ms2
    ports:
      - "8084:8081"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 10s
      retries: 10
      start_period: 30s
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gatewayserver:
    build: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    depends_on:
      eurekaserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  voitures-ms:
    build: ./voiture-microservice
    container_name: voitures-ms
    ports:
      - "8080:8080"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_CLOUD_REFRESH_NEVER_REFRESHABLE=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      marques-ms:
        condition: service_healthy
      rabbitmq:
        condition: service_started
